<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA JINWOO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#05030b;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #7020c9;background:#08050f}
.logo{font-size:27px;font-weight:900;color:#a832ff}
.logo span{display:block;color:#fff;font-size:15px}
nav a{color:#ddd;text-decoration:none;margin:0 10px}
button{cursor:pointer}
.btn{border:0;border-radius:10px;padding:12px 18px;color:#fff;font-weight:bold;background:linear-gradient(100deg,#7620ff,#d13cff)}
.page{max-width:1400px;margin:auto;padding:25px}
.layout{display:grid;grid-template-columns:190px 1fr 390px;gap:15px}
.panel,.side{background:#090611;border:1px solid #4b148d;border-radius:15px;padding:16px}
.side a{display:block;color:#ccc;padding:12px;text-decoration:none;border-radius:8px}
.side a:hover{background:#7020d0;color:#fff}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
.filter{background:#0c0714;color:#ccc;border:1px solid #50158d;border-radius:20px;padding:9px 14px}
.filter.active{background:#982cff;color:#fff}
.search,.field input,.field select,.field textarea{
width:100%;padding:12px;border-radius:9px;
background:#05030a;color:#fff;border:1px solid #51158f
}
.search{margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product{border:1px solid #4c158b;border-radius:12px;padding:10px;background:#0b0613}
.product img,.placeholder{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#150b24;display:grid;place-items:center}
.product h3{font-size:15px}
.muted{color:#a99db7;font-size:12px}
.price{font-size:20px;font-weight:bold}
.buy{width:100%;border:0;border-radius:8px;padding:10px;background:#8d27ff;color:#fff;font-weight:bold}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;color:#ccc}
.field textarea{min-height:80px}
.file{border:1px dashed #6420a3;padding:14px;border-radius:9px}
.msg{font-size:12px;margin-top:10px}
.ok{color:#20e0a5}
.err{color:#ff6688}
.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px;z-index:99}
.modal.show{display:flex}
.box{width:min(500px,100%);max-height:90vh;overflow:auto;background:#0b0614;border:1px solid #8d2cff;border-radius:15px;padding:18px}
.close{float:right;background:none;border:0;color:#fff;font-size:25px}
.order{border:1px solid #4b158b;padding:10px;border-radius:8px;margin:8px 0}
@media(max-width:1050px){
.layout{grid-template-columns:170px 1fr}
.layout>section:last-child{grid-column:2}
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
nav{display:none}
.layout{display:block}
.side{display:flex;overflow:auto;margin-bottom:10px}
.side a{white-space:nowrap}
.grid{grid-template-columns:1fr}
.page{padding:8px}
}
</style>
</head>

<body>

<header>
<div class="logo">AURA<span>JINWOO</span></div>

<nav>
<a href="#products">Products</a>
<a href="#" onclick="orders();return false">My Orders</a>
<a href="#" onclick="admin();return false">Admin</a>
</nav>

<button class="btn" onclick="auth()">👤 Account</button>
</header>

<div class="page">

<div class="layout">

<aside class="side">
<a href="#products">◇ Products</a>
<a href="#" onclick="orders();return false">🛒 Orders</a>
<a href="#" onclick="admin();return false">⚙ Admin</a>
<a href="#" onclick="logout();return false">↪ Logout</a>
</aside>

<section class="panel" id="products">

<h2>Our Products</h2>

<div class="filters">
<button class="filter active" onclick="cat('All',this)">All</button>
<button class="filter" onclick="cat('Visa',this)">Visa</button>
<button class="filter" onclick="cat('MasterCard',this)">MasterCard</button>
<button class="filter" onclick="cat('UPI',this)">UPI</button>
<button class="filter" onclick="cat('Gift Card',this)">Gift Card</button>
<button class="filter" onclick="cat('Other',this)">Other</button>
</div>

<input class="search" id="search" placeholder="🔎 Search product..." oninput="render()">

<div id="list" class="grid">
<div class="muted">Products loading...</div>
</div>

</section>

<section class="panel">

<h2>＋ Add Product</h2>

<div class="field">
<label>Product Name *</label>
<input id="pname" placeholder="Product name">
</div>

<div class="field">
<label>Price (₹) *</label>
<input id="pprice" type="number" step="any" placeholder="Price">
</div>

<div class="field">
<label>Validity / Expiry</label>
<input id="pvalid" placeholder="Example: 30 Days">
</div>

<div class="field">
<label>Category *</label>
<select id="pcat">
<option>Visa</option>
<option>MasterCard</option>
<option>UPI</option>
<option>Gift Card</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Stock Quantity *</label>
<input id="pstock" type="number" step="any" placeholder="Stock">
</div>

<div class="field">
<label>Image</label>
<div class="file">
<input id="pimage" type="file" accept="image/*">
</div>
</div>

<div class="field">
<label>Description</label>
<textarea id="pdesc" placeholder="Description"></textarea>
</div>

<button class="btn" style="width:100%" onclick="addProduct()">
▣ Add Product
</button>

<div id="msg" class="msg"></div>

</section>

</div>
</div>

<!-- LOGIN -->

<div class="modal" id="authM">
<div class="box">
<button class="close" onclick="closeAll()">×</button>

<h2>Login / Register</h2>

<div class="field">
<label>Email</label>
<input id="email" type="email">
</div>

<div class="field">
<label>Password</label>
<input id="pass" type="password">
</div>

<button class="btn" onclick="login()">Login</button>
<button class="btn" onclick="register()">Register</button>

<div id="authMsg" class="msg"></div>
</div>
</div>

<!-- ORDER -->

<div class="modal" id="orderM">
<div class="box">
<button class="close" onclick="closeAll()">×</button>

<h2>Payment</h2>

<div id="orderInfo"></div>

<img src="payment-qr.jpg"
style="width:220px;display:block;margin:15px auto;background:#fff;padding:5px">

<div class="field">
<label>UTR / Payment Reference *</label>
<input id="utr">
</div>

<button class="btn" onclick="submitOrder()">Submit Order</button>

<div id="orderMsg" class="msg"></div>
</div>
</div>

<!-- ORDERS -->

<div class="modal" id="ordersM">
<div class="box">
<button class="close" onclick="closeAll()">×</button>
<h2>My Orders</h2>
<div id="ordersList"></div>
</div>
</div>

<!-- ADMIN -->

<div class="modal" id="adminM">
<div class="box">
<button class="close" onclick="closeAll()">×</button>
<h2>Admin Panel</h2>
<div id="adminList"></div>
</div>
</div>

<script>

const SUPABASE_URL =
'https://zksdzoxmxbqqochmwxhf.supabase.co';

const SUPABASE_KEY =
'sb_publishable_FKeym5pdwLyXioleSEiPAA_tUR2uyrD';

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMINS=[
'sslive965@gmail.com',
'gamingbind40054@gmail.com'
];

let products=[];
let active='All';
let selected=null;

const $=id=>document.getElementById(id);

function closeAll(){
document.querySelectorAll('.modal')
.forEach(x=>x.classList.remove('show'));
}

function auth(){
$('authM').classList.add('show');
}

async function currentUser(){
const {data}=await db.auth.getSession();
return data.session?.user||null;
}

async function register(){

const email=$('email').value.trim();
const password=$('pass').value;

if(!email||password.length<6){
$('authMsg').textContent=
'Email और 6+ character password डालें.';
return;
}

const {error}=await db.auth.signUp({
email,password
});

$('authMsg').textContent=
error?error.message:'Registration successful.';
}

async function login(){

const {error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('pass').value
});

$('authMsg').textContent=
error?error.message:'Login successful.';

if(!error)setTimeout(closeAll,500);
}

async function logout(){
await db.auth.signOut();
location.reload();
}

function cat(c,b){

active=c;

document.querySelectorAll('.filter')
.forEach(x=>x.classList.remove('active'));

b.classList.add('active');

render();
}

async function loadProducts(){

const {data,error}=await db
.from('products')
.select('*')
.eq('active',true)
.order('created_at',{ascending:false});

if(error){
$('list').innerHTML=
'<div class="err">Products load error.</div>';
return;
}

products=data||[];
render();
}

function render(){

const q=$('search').value.toLowerCase();

const rows=products.filter(p=>
(active==='All'||p.category===active)&&
(!q||
String(p.name||'').toLowerCase().includes(q)||
String(p.description||'').toLowerCase().includes(q))
);

if(!rows.length){
$('list').innerHTML=
'<div class="muted">No products available.</div>';
return;
}

$('list').innerHTML=rows.map(p=>`

<div class="product">

${p.image_url
?`<img src="${p.image_url}">`
:`<div class="placeholder">AURA<br>JINWOO</div>`}

<div class="muted">${p.category||'Other'}</div>

<h3>${escape(p.name)}</h3>

<p class="muted">
${escape(p.description||'')}
</p>

<p class="muted">
Validity: ${escape(p.validity||'As listed')}
</p>

<p class="muted">
Stock: ${p.stock}
</p>

<div class="price">
₹${Number(p.price||0).toLocaleString('en-IN')}
</div>

<button class="buy"
onclick="buy('${p.id}')">
Buy Now
</button>

</div>

`).join('');
}

function escape(x){
return String(x??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}

async function buy(id){

const u=await currentUser();

if(!u){
auth();
return;
}

selected=products.find(p=>String(p.id)===String(id));

$('orderInfo').innerHTML=
`<div class="order">
<b>${escape(selected.name)}</b><br>
₹${Number(selected.price||0).toLocaleString('en-IN')}<br>
Validity: ${escape(selected.validity||'As listed')}
</div>`;

$('orderM').classList.add('show');
}

async function submitOrder(){

const u=await currentUser();

if(!u){
$('orderMsg').textContent='Login required.';
return;
}

const utr=$('utr').value.trim();

if(!utr){
$('orderMsg').textContent='UTR required.';
return;
}

const {error}=await db
.from('orders')
.insert({
user_id:u.id,
product_id:selected.id,
utr:utr,
status:'pending'
});

$('orderMsg').textContent=
error?error.message:
'✅ Order submitted successfully.';

if(!error)$('utr').value='';
}

async function orders(){

const u=await currentUser();

if(!u){
auth();
return;
}

$('ordersM').classList.add('show');

const {data,error}=await db
.from('orders')
.select('*,products(name,price,validity)')
.eq('user_id',u.id)
.order('created_at',{ascending:false});

if(error){
$('ordersList').textContent=error.message;
return;
}

$('ordersList').innerHTML=data?.length
?data.map(o=>`
<div class="order">
<b>${escape(o.products?.name||'Product')}</b><br>
₹${o.products?.price||0}<br>
Status: ${escape(o.status)}<br>
UTR: ${escape(o.utr)}
</div>
`).join('')
:'<div class="muted">No orders.</div>';
}

async function admin(){

$('adminM').classList.add('show');

const u=await currentUser();

if(!u){
$('adminList').innerHTML=
'<div class="err">Admin login required.</div>';
return;
}

if(!ADMINS.includes(
(u.email||'').toLowerCase()
)){
$('adminList').innerHTML=
'<div class="err">This account is not admin.</div>';
return;
}

const {data,error}=await db
.from('products')
.select('*')
.order('created_at',{ascending:false});

if(error){
$('adminList').textContent=error.message;
return;
}

$('adminList').innerHTML=data?.length
?data.map(p=>`
<div class="order">
<b>${escape(p.name)}</b><br>
₹${p.price} • Stock ${p.stock}<br>
${p.active?'Visible':'Hidden'}<br><br>

<button class="btn"
onclick="toggle('${p.id}',${!p.active})">
${p.active?'Hide':'Show'}
</button>

</div>
`).join('')
:'<div class="muted">No products.</div>';
}

async function toggle(id,active){

const {error}=await db
.from('products')
.update({active})
.eq('id',id);

if(error)alert(error.message);
else{
await loadProducts();
admin();
}
}

async function addProduct(){

const msg=$('msg');
msg.textContent='';

const u=await currentUser();

if(!u){
msg.innerHTML=
'<span class="err">पहले admin login करें.</span>';
auth();
return;
}

if(!ADMINS.includes(
(u.email||'').toLowerCase()
)){
msg.innerHTML=
'<span class="err">यह account admin नहीं है.</span>';
return;
}

const name=$('pname').value.trim();
const priceText=$('pprice').value.trim();
const validity=$('pvalid').value.trim();
const category=$('pcat').value;
const stockText=$('pstock').value.trim();
const desc=$('pdesc').value.trim();
const file=$('pimage').files?.[0];

if(!name||
priceText===''||
stockText===''){
msg.textContent=
'Name, Price और Stock भरें.';
return;
}

const price=Number(priceText);
const stock=Number(stockText);

if(!Number.isFinite(price)||
!Number.isFinite(stock)){
msg.textContent=
'Price और Stock number होने चाहिए.';
return;
}

let image_url=null;

if(file){

image_url=await new Promise(resolve=>{

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);

reader.onerror=()=>resolve(null);

reader.onabort=()=>resolve(null);

reader.readAsDataURL(file);

});

}

msg.textContent='Product saving...';

try {

  const insertPromise = db
    .from('products')
    .insert({
      name: name,
      price: price,
      validity: validity,
      category: category,
      stock: stock,
      description: description,
      image_url: image_url || null,
      active: true
    });

  const timeoutPromise = new Promise((_, reject) =>
    setTimeout(
      () => reject(new Error(
        'Supabase request timeout. Database connection or permission check failed.'
      )),
      15000
    )
  );

  const { error } = await Promise.race([
    insertPromise,
    timeoutPromise
  ]);

  if(error){
    msg.innerHTML =
      '<span class="err">❌ ' +
      escape(error.message) +
      '</span>';
    console.error('Product insert error:', error);
    return;
  }

  msg.innerHTML =
    '<span class="ok">✅ Product added successfully!</span>';

  $('pname').value='';
  $('pprice').value='';
  $('pvalid').value='';
  $('pstock').value='';
  $('pdesc').value='';
  $('pimage').value='';

  await loadProducts();

} catch(err) {

  console.error('Product save exception:', err);

  msg.innerHTML =
    '<span class="err">❌ ' +
    escape(err.message || String(err)) +
    '</span>';
}

</script>

</body>
 </html>
